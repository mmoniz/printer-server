# systemd drop-in for avahi-daemon.service -- installed by install.sh to
# /etc/systemd/system/avahi-daemon.service.d/hostname-stability.conf.
#
# Why: on a cold boot, avahi-daemon.socket brings the daemon up as part of
# multi-user.target with no ordering against the network at all, so avahi
# starts probing for "label-printer-server.local" while wlan0 is still
# associating (or mid-DHCP/SLAAC). If another device on the LAN still holds
# a cached record from before the reboot and answers the probe, avahi
# assumes the name is taken and renames itself label-printer-server-2,
# -3, etc. -- and keeps that suffix until the next restart. See the
# pi-deployment skill for the incident this was written from.
[Unit]
After=network-online.target
Wants=network-online.target

[Service]
# Defense in depth: if a previous avahi-daemon process didn't fully exit
# (a wedged restart), don't let it fight the new one over the same
# hostname. "-" ignores a nonzero exit (nothing to kill is not an error).
ExecStartPre=-/usr/bin/pkill -9 -f '^avahi-daemon: running'
ExecStartPre=/bin/sleep 1
